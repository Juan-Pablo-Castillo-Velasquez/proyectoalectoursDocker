name: AlecTours Docker CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create CI environment
        run: cp backend/.env.example backend/.env

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://admin:admin123@localhost:5432/alektours_db
          SECRET_KEY: ci-test-secret-key-solo-para-ci-no-usar-en-produccion-32chars
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          MAIL_USERNAME: test@test.com
          MAIL_PASSWORD: test
          MAIL_FROM: noreply@alectours.com
          MAIL_PORT: 1025
          MAIL_SERVER: localhost
          MAIL_FROM_NAME: AlecTours
        run: pytest test_delete_exceptions.py test_reservas_pagos.py test_destino_servicio_delete.py -v

  docker:
    name: Docker Build & Validate
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create CI environment
        run: cp backend/.env.example backend/.env

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker images
        run: docker compose build --no-cache
