
  <!DOCTYPE html>
  <html lang="es">
    <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Título SEO -->
  <title>AleckTours | Agencia de Viajes y Turismo en Colombia</title>

  <!-- Descripción SEO -->
  <meta
    name="description"
    content="Descubre los mejores destinos turísticos de Colombia con AleckTours. Reserva hoteles, paquetes turísticos, tours, experiencias y servicios de viaje de forma rápida, segura y personalizada."
  />

  <!-- Keywords -->
  <meta
    name="keywords"
    content="agencia de viajes, turismo Colombia, paquetes turísticos, hoteles, reservas, tours Colombia, viajes nacionales, vacaciones, AleckTours, destinos turísticos"
  />

  <!-- Robots -->
  <meta name="robots" content="index, follow" />

  <!-- Autor -->
  <meta name="author" content="AleckTours" />

  <!-- Canonical -->
  <link rel="canonical" href="https://proyectoalectours-docker.vercel.app/" />

  <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="AleckTours | Vive Colombia como Nunca Antes" />
  <meta
    property="og:description"
    content="Explora destinos increíbles, reserva hoteles y encuentra experiencias únicas en Colombia con AleckTours."
  />
  <meta property="og:url" content="https://proyectoalectours-docker.vercel.app/" />
  <meta property="og:site_name" content="AleckTours" />
  <meta property="og:locale" content="es_CO" />
  <meta property="og:image" content="https://proyectoalectours-docker.vercel.app/og-image.jpg" />

  <!-- Twitter/X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="AleckTours | Agencia de Viajes y Turismo" />
  <meta
    name="twitter:description"
    content="Reserva hoteles, paquetes turísticos y experiencias únicas en Colombia."
  />
  <meta name="twitter:image" content="https://proyectoalectours-docker.vercel.app/og-image.jpg" />

  <!-- Theme Color -->
  <!-- Antes #0F766E (un teal que no existe en ningun lado de la paleta
       real del sitio -- granate/dorado, ver theme.css). Se deja el
       granate de marca como valor por defecto para el navegador/SO
       (barra de titulo en Android, PWA, etc.); TemaContext.tsx lo
       actualiza en vivo si el visitante esta en modo oscuro o con un
       tema de temporada activo, igual que ya hace con el resto del
       sitio -- ver aplicarTemaEnDOM(). -->
  <meta name="theme-color" content="#6e1832" />

  <!-- Favicon -->
  <!-- SVG primero (vectorial, nitido a cualquier tamaño) con el PNG como
       respaldo para navegadores que aun no soportan favicon SVG. El
       propio badge del navbar (Navbar.tsx: cuadrado granate + avion
       blanco) es el logo oficial -- estos archivos son exactamente ese
       diseño exportado, no un ícono aparte inventado para la pestaña. -->
  <link id="favicon-svg" rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link id="favicon-png" rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />


    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "TravelAgency",
  "name": "AleckTours",
  "url": "https://proyectoalectours-docker.vercel.app",
  "description": "Agencia de viajes especializada en paquetes turísticos, reservas de hoteles, tours y experiencias en Colombia.",
  "telephone": "+57-322-812-7104",
  "address": {
    "@type": "PostalAddress",
    "addressCountry": "CO"
  },
  "areaServed": "Colombia"
}
</script>
    </body>
  </html>
