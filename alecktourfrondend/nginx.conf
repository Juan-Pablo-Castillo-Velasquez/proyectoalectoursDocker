server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA con react-router (createBrowserRouter): cualquier ruta que no sea
    # un archivo real (assets, imágenes) debe caer en index.html para que
    # el router del lado del cliente decida qué pantalla mostrar — sin esto,
    # recargar la página en /profile o /admin daría 404 desde nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets versionados por Vite (hash en el nombre del archivo) — se
    # pueden cachear agresivamente porque un contenido nuevo siempre viene
    # con un nombre de archivo distinto.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
