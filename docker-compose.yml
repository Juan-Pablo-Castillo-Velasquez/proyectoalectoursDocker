services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: always

    environment:
      POSTGRES_DB: alektours_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - alecktours_network

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: always

    ports:
      - "1025:1025"
      - "8025:8025"

    networks:
      - alecktours_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: correoadmin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin1234

    ports:
      - "5050:80"

    depends_on:
      - postgres

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - alecktours_network

  backend:
    build:
      context: ./backend
      target: dev

    container_name: fastapi_backend
    restart: always

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    env_file:
      - ./backend/.env

    depends_on:
      - postgres
      - mailpit

    networks:
      - alecktours_network

  frontend:
    build:
      context: ./alecktourfrondend

    container_name: react_frontend
    restart: always

    ports:
      - "5173:5173"

    volumes:
      - ./alecktourfrondend:/app
      - /app/node_modules

    depends_on:
      - backend

    networks:
      - alecktours_network
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - alecktours_network
volumes:
  postgres_data:
  pgadmin_data:

networks:
  alecktours_network:
    driver: bridge
