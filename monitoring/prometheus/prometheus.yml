# Config de scrape de Prometheus para AlecTours.
#
# ¿Qué? Le dice a Prometheus qué objetivos consultar (scrape) y cada
#        cuánto, para recolectar las métricas que expone el backend en
#        GET /metrics (ver app/main.py, Instrumentator).
# ¿Para qué? Sin esto Prometheus no sabe que el backend existe -- el
#        servicio "prometheus" de docker-compose monta este archivo en
#        /etc/prometheus/prometheus.yml.
# ¿Impacto? scrape_interval de 15s: suficiente resolución para ver
#        picos de latencia por endpoint sin generar tráfico/almacenamiento
#        excesivo en un proyecto de este tamaño.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # El backend se llama "backend" en la red de docker-compose (mismo
  # nombre que el servicio) -- Prometheus lo resuelve por DNS interno de
  # Docker, igual que el propio backend resuelve "postgres"/"redis".
  - job_name: "alectours-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          servicio: "fastapi-backend"
          proyecto: "alectours"

  # Prometheus se mide a sí mismo -- útil para confirmar que el propio
  # contenedor de monitoreo está sano, no aporta métricas de negocio.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
