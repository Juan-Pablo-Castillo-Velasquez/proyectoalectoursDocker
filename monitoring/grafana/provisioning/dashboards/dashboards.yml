# Le dice a Grafana que cargue automáticamente cualquier archivo .json de
# dashboard que se agregue a esta misma carpeta (ver api-alectours.json) --
# así el dashboard de arranque queda versionado en el repo en vez de vivir
# solo en el volumen de datos de Grafana (que un `docker compose down -v`
# podría borrar).
apiVersion: 1

providers:
  - name: "AlecTours"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
